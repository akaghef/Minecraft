name: Check sources and tooling fixtures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.14.2
      - run: python scripts/check_privacy.py
      - run: python -m pip install mcschematic==11.4.4 nucleation==0.12.4
      - run: python scripts/schematic_smoke.py
      - run: g++ -O2 -std=c++17 calculator/audit/audit.cpp -o build/cordic-audit
      - run: build/cordic-audit > build/cordic-audit-result.txt
      - run: python calculator/audit/crosscheck.py
      - run: python calculator/audit/check_translation.py
